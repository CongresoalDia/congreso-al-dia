# Actualiza los datos del sitio todos los días y sube los JSON que cambien.
name: Actualizar datos

on:
  schedule:
    - cron: "0 10 * * *"  # 07:00 en Chile (horario de verano, UTC-3); 06:00 en invierno
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install pillow

      # Datos crudos ya descargados (no se versionan): así cada día solo se baja lo nuevo
      - name: Recuperar datos crudos
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: datos-crudos-${{ github.run_id }}
          restore-keys: datos-crudos-

      - name: Cámara
        id: camara
        continue-on-error: true
        run: |
          python pipeline/descargar.py
          python pipeline/calcular.py
          python pipeline/medios.py

      # El Senado no está aquí: su API responde 403 a los servidores de GitHub. Se actualiza desde un PC (ver README).

      - name: Presupuesto
        id: presupuesto
        continue-on-error: true
        run: python pipeline/presupuesto.py

      - name: Guardar datos crudos
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: datos-crudos-${{ github.run_id }}

      - name: Subir cambios
        run: |
          git config user.name "Congreso al día"
          git config user.email "345353701+MartinQuiri@users.noreply.github.com"
          git add web data/diputados.csv data/diputados.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos al $(TZ=America/Santiago date +%d-%m-%Y)"
            git push
          fi

      # Si alguna fuente falló, el flujo queda en rojo (y GitHub avisa por correo), aunque se suba lo que sí funcionó
      - name: Revisar fuentes
        if: steps.camara.outcome == 'failure' || steps.presupuesto.outcome == 'failure'
        run: |
          echo "Cámara: ${{ steps.camara.outcome }} · Presupuesto: ${{ steps.presupuesto.outcome }}"
          exit 1
